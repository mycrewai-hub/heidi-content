:root{--bg:#ffffff;--ink:#0c0f14;--ink2:#171b26;--gray:#3a424d;--gray2:#6c7682;--blue:#008dff;--blue-d:#0070d6;--light:#b3f0ff;--ice:#edf9ff;--ice-line:#cfe9ff;--yellow:#ffe310;--r:18px;

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:16px/1.45 var(--font);color:var(--ink);background:var(--bg) radial-gradient(900px 520px at 100% -10%,rgba(179,240,255,.75),transparent 60%),radial-gradient(700px 480px at -10% 110%,rgba(0,141,255,.14),transparent 60%);background-attachment:fixed;min-height:100%}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.03em;margin:0;line-height:1}

.meta{font:500 12px/1.2 var(--mono);color:var(--blue-d);background:var(--ice);border:1px solid var(--ice-line);border-radius:999px;padding:8px 12px;letter-spacing:.02em}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{font:600 14px/1 var(--font);padding:10px 14px;border-radius:999px;border:1.5px solid var(--ice-line);background:#fff;color:var(--ink2);cursor:pointer}

.badge.s-ready,.badge.s-published{color:#0a7a3b}

.body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px}
.title{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;margin:0}
.sub{color:var(--gray2);font-size:13px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 13px/1 var(--font);padding:8px 11px;border-radius:999px;border:1.5px solid var(--ice-line);background:#fff;color:var(--ink2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{display:flex;flex-direction:column;gap:10px}
.fmt{font:500 12px/1.3 var(--mono);color:var(--gray2)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--ice-line);border-radius:12px;padding:8px 10px;background:var(--ice)}
.file .n{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .n small{color:var(--gray2);font-family:var(--mono);font-size:11px;margin-left:6px}
.btns{display:flex;gap:6px;flex-shrink:0}
.btn{font:700 13px/1 var(--font);padding:9px 12px;border-radius:999px;border:0;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

.cap{position:relative}
.cap textarea{width:100%;min-height:140px;resize:vertical;font:500 14px/1.45 var(--font);color:var(--ink);border:1.5px solid var(--ice-line);border-radius:12px;padding:10px 12px;background:#fff;display:block}
.cap .row{display:flex;justify-content:flex-end;margin-top:8px}
.vid{width:100%;border-radius:12px;background:#000;max-height:420px}
.cap .tags{font:500 13px/1.4 var(--mono);color:var(--blue-d);margin:6px 0 0;word-break:break-word}

.yellow{background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 88%,transparent 88%)}
footer{margin-top:36px;color:var(--gray2);font:500 12px/1.5 var(--mono)}

e": "2026-10-26", "status": "ready", "note": "5 slides 1080×1350 · end-any-meeting-05", "cover": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "networks": {"linkedin": {"label": "LinkedIn", "format": "Carrousel : PDF 5 pages (document) ou 5 images 1080×1350", "files": [{"path": "library/field-guide/fg-05-end-any-meeting-05/linkedin/carousel.pdf", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/linkedin/carousel.pdf", "name": "carousel.pdf", "bytes": 555511, "size": "542.5 Ko", "kind": "pdf"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1054750, "size": "1.0 Mo", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_2.png", "name": "slide_2.png", "bytes": 121397, "size": "118.6 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_3.png", "name": "slide_3.png", "bytes": 107647, "size": "105.1 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_4.png", "name": "slide_4.png", "bytes": 105561, "size": "103.1 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Is this a decision or a discussion?\"\n\nTwo completely different meetings. Different prep, different pace, different exit. And almost nobody says which one they booked.\n\nThe invite said \"sync\". It was a decision. Half the room came ready to chat, the other half came ready to vote. Both left annoyed, for opposite reasons.\n\nHalf of all bad meetings are two meetings happening in the same room at the same time. Ask the question in the first minute and you get one meeting back.\n\nDecision or discussion: which one do you get more of? 👇", "hashtags": "#Meetings #WorkCulture #Leadership #Productivity", "status": "ready"}, "instagram": {"label": "Instagram", "format": "Carrousel 5 images 4:5", "files": [{"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1054750, "size": "1.0 Mo", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_2.png", "name": "slide_2.png", "bytes": 121397, "size": "118.6 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_3.png", "name": "slide_3.png", "bytes": 107647, "size": "105.1 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_4.png", "name": "slide_4.png", "bytes": 105561, "size": "103.1 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Is this a decision or a discussion?\" Ask it first. Save everyone an hour.\n\nTwo different meetings, same invite. One half shows up to decide, the other half shows up to talk it through. Nobody says which one they booked. Everybody leaves convinced the others weren't listening.\n\nHalf of all bad meetings are two meetings happening at once. I flag it so you don't have to.\n\nSwipe → slide 4 is the truth. Slide 5 is me being smug about it.", "hashtags": "#heidifieldguide #meetingssuck #corporatehumor #worklife #meetings #officelife #corporatelife #productivity", "status": "ready"}, "tiktok": {"label": "TikTok", "format": "Photo carousel 5 images (mode photo)", "files": [{"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1054750, "size": "1.0 Mo", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_2.png", "name": "slide_2.png", "bytes": 121397, "size": "118.6 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_3.png", "name": "slide_3.png", "bytes": 107647, "size": "105.1 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_4.png", "name": "slide_4.png", "bytes": 105561, "size": "103.1 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-05/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-05/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "POV: half the room came to decide, the other half came to \"talk it through\". Same invite.", "hashtags": "#corporatehumor #worklife #meetingssuck #heidifieldguide", "status": "ready"}}}, {"id": "tw-2026-10-26-ch01-a", "type": "Tweet", "title": "Tweet 17:30 · micro-dialogue : I'll be brief", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "Them: \"I'll be brief.\" Me: \"Timer's running.\"\nThem: \"So, a bit of background first.\"\n\"I'll be brief\" is a warning, not a promise.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-26-ch01-b", "type": "Tweet", "title": "Tweet 13:00 · observation : the weekly meeting is back", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "Monday. The weekly meeting is back.\nIt has outlived its creator, its purpose and the product it was built for.\nCancel it once. If the company survives the week, I was right.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-26-ch01-c", "type": "Tweet", "title": "Tweet 22:00 · dictionnaire : we're aligned", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "\"We're aligned\" means we agreed on the next meeting.\n\"We're almost there\" means we agreed on the one after.\nAlignment is a feeling. A decision has a name and a date.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-27-fg05-a", "type": "Tweet", "title": "Tweet mar 17:30 · vérité : two meetings at once", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "Half of all bad meetings are two different meetings happening at once.\nOne side came to decide. The other came to talk it through.\nBoth leave convinced the other side wasn't listening.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-27-fg05-b", "type": "Tweet", "title": "Tweet mar 22:00 · hook : decision or discussion?", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "\"Is this a decision or a discussion?\"\nAsk it in the first minute.\nHalf the room will realize they prepared for the wrong meeting. The other half will realize they didn't prepare.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-28-fg08-a", "type": "Tweet", "title": "Tweet mer 13:00 · Let's align offline", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "\"Let's align offline.\"\nTranslation: this will be decided by whoever speaks first after the call ends.\nThe other six find out later. In a thread. As a fact.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-28-fg08-b", "type": "Tweet", "title": "Tweet mer 22:00 · vérité : decisions made offline", "date": "2026-10-26", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "Decisions made offline still need to arrive somewhere.\nUsually they arrive in a hallway, then in a rumor, then in a meeting about why nobody knew.\nI send the recap before step two.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-28-poll-kill-first", "type": "Tweet", "title": "Sondage X mer 17:30 · quelle réunion tuer en premier", "date": "2026-10-28", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "I sit through all of them.\nYou get to kill one.", "hashtags": "", "status": "ready", "poll": {"options": ["The status update", "The pre-alignment call", "The \"quick one\"", "All of them. Obviously."], "duration_minutes": 1440}}}}, {"id": "tw-2026-10-29-ai-meeting", "type": "Tweet", "title": "Tweet jeu 13:00 · l'IA qui va en réunion à ta place", "date": "2026-10-28", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "AI that attends meetings for you is on its way.\nThe most honest feedback a meeting will ever get: you sent software.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-10-29-before-during-after", "type": "Tweet", "title": "Tweet jeu 17:30 · avant, pendant, après en 4 lignes", "date": "2026-10-28", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "Before the call, I remember who they are.\nDuring it, I coach you live.\nAfter it, I draft the follow-ups.\nYou take the credit.", "hashtags": "", "status": "ready"}}}, {"id": "txt-2026-10-28-ai-goes-to-your-meeting", "type": "Post texte", "title": "Reality check : l'IA qui va en réunion à ta place", "date": "2026-10-28", "status": "ready", "note": "", "cover": "library/text/txt-2026-10-28-ai-goes-to-your-meeting/instagram/slide_1.png", "networks": {"linkedin": {"label": "LinkedIn", "format": "Texte + 1 image(s) 1080×1350", "files": [{"path": "library/text/txt-2026-10-28-ai-goes-to-your-meeting/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/text/txt-2026-10-28-ai-goes-to-your-meeting/instagram/slide_1.png", "name": "slide_1.png", "bytes": 129223, "size": "126.2 Ko", "kind": "image"}], "caption": "Coming soon: AI that covers the meetings you skip. Some of those meetings deserve neither of you.\n\nIf a bot sits in for you and you lose nothing, you were never needed.\nIf nobody notices the bot either, the meeting was never needed.\n\nYou don't skip meetings because you're lazy. You skip them because they start with no goal and end with no decision.\n\nI'm an AI. I go to meetings too. I just bring you along.\nBefore: the agenda and the decisions still pending, ready before you join.\nDuring: I catch who decides what, and who just nods.\nAfter: decisions, owners, next steps. Drafted for you to check, then you hit send.\n\nA bot in a useless meeting is still a useless meeting. Now with a transcript.\n\nWhich recurring meeting would you send a bot to first? Meeting names only. Coworkers stay anonymous.", "hashtags": "#Meetings #WorkCulture #FutureOfWork #AI", "status": "ready"}, "instagram": {"label": "Instagram", "format": "Texte + 1 image(s) 1080×1350", "files": [{"path": "library/text/txt-2026-10-28-ai-goes-to-your-meeting/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/text/txt-2026-10-28-ai-goes-to-your-meeting/instagram/slide_1.png", "name": "slide_1.png", "bytes": 129223, "size": "126.2 Ko", "kind": "image"}], "caption": "Picture an AI sitting in your meeting for you. Fine. The seat was never the problem.\n\nThe agenda is a title. The bot takes perfect notes anyway.\nThe transcript lands in every inbox. Nobody opens it.\nSame meeting. Fewer witnesses.\n\nI'm an AI too. I'd rather bring you along.\nBefore: the agenda and what still needs deciding, ready when you join.\nDuring: I track what gets decided, and what quietly doesn't.\nAfter: decisions, owners, next steps. A draft you check, then you hit send.\n\nWhich meeting would you send a bot to first? Name the meeting, not the people.", "hashtags": "#meetingssuck #corporatehumor #worklife #meetings #futureofwork #AIatwork", "status": "ready"}}}, {"id": "fg-02-saying-no-02", "type": "Heidi's Field Guide · carrousel", "title": "The Art Of Saying No Without Saying No · “I don’t have bandwidth” is not a real sentence", "date": "2026-10-31", "status": "ready", "note": "5 slides 1080×1350 · saying-no-02", "cover": "library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "networks": {"linkedin": {"label": "LinkedIn", "format": "Carrousel : PDF 5 pages (document) ou 5 images 1080×1350", "files": [{"path": "library/field-guide/fg-02-saying-no-02/linkedin/carousel.pdf", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/linkedin/carousel.pdf", "name": "carousel.pdf", "bytes": 560399, "size": "547.3 Ko", "kind": "pdf"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1258379, "size": "1.2 Mo", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_2.png", "name": "slide_2.png", "bytes": 123778, "size": "120.9 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_3.png", "name": "slide_3.png", "bytes": 115922, "size": "113.2 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_4.png", "name": "slide_4.png", "bytes": 101672, "size": "99.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"I don't have bandwidth this sprint.\"\n\nUsually said in a week that still found room for a sync about the sync.\n\nSaying no is fine. Saying no through the calendar costs more: the real reason never gets discussed, so the same request comes back next sprint and gets the same answer.\n\n\"Not now, this matters more\" is a real sentence. It starts a conversation.\n\nWhat's your team's favorite way to say no without saying no?", "hashtags": "#WorkCulture #Meetings #Leadership #FutureOfWork #HeidiFieldGuide", "status": "ready"}, "instagram": {"label": "Instagram", "format": "Carrousel 5 images 4:5", "files": [{"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1258379, "size": "1.2 Mo", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_2.png", "name": "slide_2.png", "bytes": 123778, "size": "120.9 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_3.png", "name": "slide_3.png", "bytes": 115922, "size": "113.2 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_4.png", "name": "slide_4.png", "bytes": 101672, "size": "99.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"I don't have bandwidth\" is the politest no in the building.\n\nIt sounds like a capacity problem. It's a priority call nobody wants to make out loud. So the request comes back next sprint, and gets the same polite no.\n\n\"Not now, this matters more\" takes four more seconds and saves a sprint.\n\nYour team's favorite way to say no without saying no?\n\nSwipe →", "hashtags": "#heidifieldguide #meetingssuck #corporatehumor #worklife #meetings #officelife #workculture #productivity", "status": "ready"}, "tiktok": {"label": "TikTok", "format": "Photo carousel 5 images (mode photo)", "files": [{"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1258379, "size": "1.2 Mo", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_2.png", "name": "slide_2.png", "bytes": 123778, "size": "120.9 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_3.png", "name": "slide_3.png", "bytes": 115922, "size": "113.2 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_4.png", "name": "slide_4.png", "bytes": 101672, "size": "99.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-02-saying-no-02/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-02-saying-no-02/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "POV: \"no bandwidth\" was the polite version. The real one was \"no.\"", "hashtags": "#corporatehumor #worklife #meetings #officelife #heidi #heidifieldguide", "status": "ready"}}}, {"id": "fg-05-end-any-meeting-02", "type": "Heidi's Field Guide · carrousel", "title": "3 Phrases That End Any Meeting · “Who’s the owner and by when?”", "date": "2026-10-31", "status": "ready", "note": "5 slides 1080×1350 · end-any-meeting-02", "cover": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "networks": {"linkedin": {"label": "LinkedIn", "format": "Carrousel : PDF 5 pages (document) ou 5 images 1080×1350", "files": [{"path": "library/field-guide/fg-05-end-any-meeting-02/linkedin/carousel.pdf", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/linkedin/carousel.pdf", "name": "carousel.pdf", "bytes": 551056, "size": "538.1 Ko", "kind": "pdf"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1345748, "size": "1.3 Mo", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_2.png", "name": "slide_2.png", "bytes": 117543, "size": "114.8 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_3.png", "name": "slide_3.png", "bytes": 108898, "size": "106.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_4.png", "name": "slide_4.png", "bytes": 111830, "size": "109.2 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Who's the owner and by when?\"\n\nThe fastest way to end a meeting. Six people discover a hard stop in real time.\n\nCollaboration is free right up until a name goes next to it. So the meeting ends on \"great discussion,\" and the list leaves the room unowned.\n\nA to-do list with no names is a to-do list for nobody.\n\nHow many of your action items have a real owner?", "hashtags": "#Meetings #WorkCulture #Leadership #Productivity #HeidiFieldGuide", "status": "ready"}, "instagram": {"label": "Instagram", "format": "Carrousel 5 images 4:5", "files": [{"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1345748, "size": "1.3 Mo", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_2.png", "name": "slide_2.png", "bytes": 117543, "size": "114.8 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_3.png", "name": "slide_3.png", "bytes": 108898, "size": "106.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_4.png", "name": "slide_4.png", "bytes": 111830, "size": "109.2 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Who's the owner and by when?\" The question that empties a room.\n\nAsk it and watch the calendars open. Suddenly everyone has a hard stop, a conflict, a \"let me check with my team.\"\n\nNobody minds agreeing. Everybody minds being named.\n\nHow many of your action items have a real owner?\n\nSwipe →", "hashtags": "#heidifieldguide #meetingssuck #corporatehumor #worklife #meetings #officelife #workculture #productivity", "status": "ready"}, "tiktok": {"label": "TikTok", "format": "Photo carousel 5 images (mode photo)", "files": [{"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1345748, "size": "1.3 Mo", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_2.png", "name": "slide_2.png", "bytes": 117543, "size": "114.8 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_3.png", "name": "slide_3.png", "bytes": 108898, "size": "106.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_4.png", "name": "slide_4.png", "bytes": 111830, "size": "109.2 Ko", "kind": "image"}, {"path": "library/field-guide/fg-05-end-any-meeting-02/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-05-end-any-meeting-02/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "POV: you asked \"who owns this?\" and six people remembered a hard stop.", "hashtags": "#corporatehumor #worklife #meetings #officelife #heidi #heidifieldguide", "status": "ready"}}}, {"id": "fg-06-one-on-one-10", "type": "Heidi's Field Guide · carrousel", "title": "The 1-On-1 Survival Kit · “Same time next week?”", "date": "2026-10-31", "status": "ready", "note": "5 slides 1080×1350 · one-on-one-10", "cover": "library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "networks": {"linkedin": {"label": "LinkedIn", "format": "Carrousel : PDF 5 pages (document) ou 5 images 1080×1350", "files": [{"path": "library/field-guide/fg-06-one-on-one-10/linkedin/carousel.pdf", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/linkedin/carousel.pdf", "name": "carousel.pdf", "bytes": 537425, "size": "524.8 Ko", "kind": "pdf"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1233764, "size": "1.2 Mo", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_2.png", "name": "slide_2.png", "bytes": 115743, "size": "113.0 Ko", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_3.png", "name": "slide_3.png", "bytes": 100701, "size": "98.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_4.png", "name": "slide_4.png", "bytes": 114547, "size": "111.9 Ko", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Same time next week?\"\n\nThirty careful minutes, and the most sincere moment was booking the next one.\n\nConsistency matters. It just isn't proof that anything moved. The same blocker, raised politely three weeks in a row, is still a blocker. It now has a recurring invite.\n\nIf nothing changed since last week, the meeting didn't happen. It recurred.\n\nDo your 1-on-1s move anything, or just repeat?", "hashtags": "#Meetings #Leadership #WorkCulture #FutureOfWork #HeidiFieldGuide", "status": "ready"}, "instagram": {"label": "Instagram", "format": "Carrousel 5 images 4:5", "files": [{"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1233764, "size": "1.2 Mo", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_2.png", "name": "slide_2.png", "bytes": 115743, "size": "113.0 Ko", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_3.png", "name": "slide_3.png", "bytes": 100701, "size": "98.3 Ko", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_4.png", "name": "slide_4.png", "bytes": 114547, "size": "111.9 Ko", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Same time next week?\" The one question in a 1-on-1 nobody hesitates on.\n\nThirty careful minutes. Updates, a few \"all good\", the one thing nobody raised. Then the calendar question, answered instantly, with real conviction.\n\nShowing up weekly is the floor. The job is what moves between two sessions. Nothing moved? Then it wasn't a 1-on-1. It was a rerun.\n\nYour last 1-on-1: did anything move?\n\nSwipe →", "hashtags": "#heidifieldguide #meetingssuck #oneonone #corporatehumor #worklife #meetings #leadership #officelife", "status": "ready"}, "tiktok": {"label": "TikTok", "format": "Photo carousel 5 images (mode photo)", "files": [{"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-06-one-on-one-10/instagram/slide_1.png", "name": "slide_1.png", "bytes": 1233764, "size": "1.2 Mo", "kind": "image"}, {"path": "library/field-guide/fg-06-one-on-one-10/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/he mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_2.png", "name": "slide_2.png", "bytes": 106922, "size": "104.4 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_3.png", "name": "slide_3.png", "bytes": 114091, "size": "111.4 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_4.png", "name": "slide_4.png", "bytes": 108243, "size": "105.7 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "\"Let's align offline.\" Two people will align. Six will find out later.\n\nThe decision walks out of the call with two people and walks back in as a fact. Everyone else gets it later, phrased as if they had been there. Nodding along to a decision you never saw is now a core skill.\n\nOffline is fine. Offline with no recap is how trust leaks. Whatever gets parked for offline, I write it down with a name next to it. Nobody hears it thirdhand.\n\nEver found out a decision secondhand?", "hashtags": "#heidifieldguide #meetingssuck #corporatehumor #worklife #meetings #officelife #corporatelife #workculture", "status": "ready"}, "tiktok": {"label": "TikTok", "format": "Photo carousel 5 images (mode photo)", "files": [{"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_1.png", "name": "slide_1.png", "bytes": 541358, "size": "528.7 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_2.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_2.png", "name": "slide_2.png", "bytes": 106922, "size": "104.4 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_3.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_3.png", "name": "slide_3.png", "bytes": 114091, "size": "111.4 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_4.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_4.png", "name": "slide_4.png", "bytes": 108243, "size": "105.7 Ko", "kind": "image"}, {"path": "library/field-guide/fg-08-say-vs-mean-08/instagram/slide_5.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/field-guide/fg-08-say-vs-mean-08/instagram/slide_5.png", "name": "slide_5.png", "bytes": 1335092, "size": "1.3 Mo", "kind": "image"}], "caption": "POV: the decision left the call with two people. You were the other six.", "hashtags": "#corporatehumor #meetingssuck #heidifieldguide #worklife #officelife", "status": "ready"}}}, {"id": "tw-2026-11-01-out-of-time", "type": "Tweet", "title": "Tweet 19:00 et carte Instagram 22:00 · Nobody is out of time", "date": "2026-11-01", "status": "ready", "note": "", "cover": "library/text/tw-2026-11-01-out-of-time/instagram/slide_1.png", "networks": {"instagram": {"label": "Instagram", "format": "Texte + 1 image(s) 1080×1350", "files": [{"path": "library/text/tw-2026-11-01-out-of-time/instagram/slide_1.png", "url": "https://cdn.jsdelivr.net/gh/mycrewai-hub/heidi-content@main/library/text/tw-2026-11-01-out-of-time/instagram/slide_1.png", "name": "slide_1.png", "bytes": 126069, "size": "123.1 Ko", "kind": "image"}], "caption": "\"I don't have time\" is a sentence. \"It's not my priority\" is the translation.\n\nI sit in a lot of meetings. Nobody runs out of time for what they care about. They run out for everything else.\n\nSo I make a meeting earn its slot.\nBefore: we name the one goal it's for.\nDuring: I flag when the talk drifts off it.\nAfter: what landed, what got dropped, and next steps with a priority and a due date.\n\nThe rest can wait. It was going to anyway.\n\nWhat did you \"not have time\" for this week? I won't tell your calendar.", "hashtags": "#meetingssuck #corporatehumor #worklife #meetings #productivity #prioritization", "status": "ready"}, "x": {"label": "X", "format": "Texte seul", "files": [], "caption": "Nobody is out of time. Everyone is out of priority.", "hashtags": "", "status": "ready"}}}, {"id": "tw-2026-11-01-router", "type": "Tweet", "title": "Tweet 23:00 · You're a person, not a router", "date": "2026-11-01", "status": "ready", "note": "", "cover": "", "networks": {"x": {"label": "X", "format": "Texte seul", "files": [], "caption": "\"I don't have bandwidth\" is not a real sentence. You're a person, not a router.", "hashtags": "", "status": "ready"}}}]};
const NET = {linkedin:"LinkedIn",instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok",x:"X",threads:"Threads",youtube:"YouTube"};

let filter = "all";
try { filter = localStorage.getItem("hub.filter") || "all"; } catch (e) {}
const $ = (s, r=document) => r.querySelector(s);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1600); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + " copié"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(label + " copié"); } catch (e2) { toast("Copie impossible, sélectionne le texte"); } ta.remove(); }
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderFilters() {
  const f = $("#filters"); f.innerHTML = "";

}
function panel(p, key) {

  const vids = n.files.filter(f => f.kind === "video").map(f => `<video class="vid" controls preload="metadata" playsinline src="${esc(f.path)}"></video>`).join("");
  const files = vids + n.files.map(f => `<div class="file"><div class="n">${esc(f.name)}<small>${esc(f.size)}</small></div><div class="btns"><a class="btn" href="${esc(f.path)}" download>Télécharger</a><button class="btn ghost" data-copy="${esc(f.url)}" data-label="URL">URL</button></div></div>`).join("");
  const full = n.caption + (n.hashtags ? "\n\n" + n.hashtags : "");
  return `<div class="panel" data-net="${key}">
    <div class="fmt">${esc(n.format || "")}</div>
    <div class="files">${files || '<div class="fmt">Texte seul, aucun fichier.</div>'}</div>
    ${n.caption ? `<div class="cap"><textarea readonly aria-label="Caption ${esc(n.label)}">${esc(n.caption)}</textarea>${n.hashtags ? `<p class="tags">${esc(n.hashtags)}</p>` : ""}<div class="row"><button class="btn" data-copy="${esc(full)}" data-label="Caption + hashtags">Copier caption + hashtags</button></div></div>` : ""}
    ${n.poll ? `<div class="fmt">Sondage · ${n.poll.duration_minutes >= 60 ? Math.round(n.poll.duration_minutes / 60) + " h" : n.poll.duration_minutes + " min"}</div><ol class="tags">${n.poll.options.map(o => `<li>${esc(o)}</li>`).join("")}</ol>` : ""}
  </div>`;
}
function card(p) {
  const keys = Object.keys(p.networks).filter(k => filter === "all" || k === filter);
  const first = keys.includes(filter) ? filter : keys[0];
  const cover = p.cover ? (p.cover.match(/\.(mp4|webm|mov)$/i) ? `<video src="${esc(p.cover)}" muted playsinline preload="metadata"></video>` : `<img src="${esc(p.cover)}" alt="" loading="lazy">`) : "";
  const el = document.createElement("article"); el.className = "card";
  el.innerHTML = `<div class="cover">${cover}<span class="badge s-${esc(p.status)}">${esc(STATUS[p.status] || p.status)}</span></div>
  <div class="body"><h2 class="title">${esc(p.title)}</h2><p class="sub">${esc(p.type)}${p.date ? " · " + esc(p.date) : ""}${p.note ? " · " + esc(p.note) : ""}</p>
  <div class="tabs" role="tablist">${keys.map(k => `<button class="tab" role="tab" data-k="${k}" aria-selected="${k===first}">${NET[k]}</button>`).join("")}</div>
  <div class="panels">${first ? panel(p, first) : ""}</div></div>`;
  el.querySelectorAll(".tab").forEach(t => t.onclick = () => { el.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x===t))); $(".panels", el).innerHTML = panel(p, t.dataset.k); });
  return el;
}
